# Static publish; the whole folder is the site.
[build]
  publish = "."
  functions = "netlify/functions"

# The assistant needs the catalogue index at runtime. Netlify only bundles what a
# function requires, and this is read with fs, so it has to be named explicitly.
[functions]
  included_files = ["data/index.txt"]

# The redirects and headers that used to live here are in _redirects and _headers at
# the site root instead. Nothing in this file was reaching the CDN: /about.html and
# every other 301 answered 404, the security headers never appeared, and assets were
# served with max-age=0 rather than the day declared here. _redirects and _headers are
# read from the published output, so they do not depend on whatever is wrong with this.
#
# The functions setting above is in the same boat -- /.netlify/functions/assistant is
# a 404 in production while netlify/functions/assistant.js is served as a static file.
# That one cannot be fixed from the repository: check the functions directory under
# Site configuration -> Build & deploy in the Netlify dashboard.
